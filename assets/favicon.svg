<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#38bdf8" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect width="64" height="64" rx="16" fill="none" stroke="url(#cyberGrad)" stroke-width="2" opacity="0.6"/>

  <!-- Shield Outline -->
  <path d="M32 11 L47 17 V30 C47 41 32 50 32 50 C32 50 17 41 17 30 V17 Z" 
        fill="rgba(14, 165, 233, 0.15)" 
        stroke="url(#cyberGrad)" 
        stroke-width="3" 
        stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- Terminal Prompt >_ in Center -->
  <path d="M26 25 L32 29.5 L26 34" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="34" y1="34" x2="39" y2="34" stroke="#10b981" stroke-width="2.5" stroke-linecap="round"/>
</svg>
